[pytest]
# Directorio donde pytest busca tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers personalizados
markers =
    unit: Tests unitarios
    integration: Tests de integración
    slow: Tests que tardan más tiempo
    wsi: Tests que requieren archivos WSI reales
    upload: Tests relacionados con upload de archivos
    
# Configuración de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout por defecto para tests async
asyncio_mode = auto

# Mínimo porcentaje de cobertura (opcional, para futuro)
# [coverage:run]
# omit = tests/*

# Logging durante tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
