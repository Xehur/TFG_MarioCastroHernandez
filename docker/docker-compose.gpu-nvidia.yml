# IA en GPU NVIDIA (CUDA). Se combina con el fichero principal:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu-nvidia.yml up --build
#
# Requisitos del equipo anfitrión:
#   - Linux: driver NVIDIA + NVIDIA Container Toolkit.
#   - Windows: Docker Desktop con backend WSL2 y driver NVIDIA reciente
#     (la GPU se expone al contenedor automáticamente).
# Si la GPU no está disponible, la IA sigue funcionando en CPU (aviso en el log).
services:
  backend:
    image: wsi-tfg-backend:cuda
    build:
      args:
        # CUDA 12.6: compatible con drivers NVIDIA recientes. Se puede cambiar por
        # cu129/cu130 definiendo TORCH_CUDA_INDEX_URL en docker/.env.
        TORCH_INDEX_URL: ${TORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    environment:
      AI_DEVICE: cuda
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-32}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
