server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica de assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: cualquier ruta desconocida sirve index.html (enrutado en el cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo largo de los assets con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
